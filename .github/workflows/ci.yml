name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      JEV_KEY: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e '.[video]' build
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic demo and CLI help
        run: |
          jev-vampire demo
          python tools/launch_vampire.py --help
          python tools/render_vampire_timelapse.py --help
      - name: Build source and wheel distributions
        run: python -m build
      - name: Compile Python sources
        run: python -m compileall -q vampire_agent tools examples tests
