[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-vampire-survivors"
version = "0.1.0"
description = "Jev gameplay agent, local Vampire Survivors bridge and recorded experiments"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "banjtheman and contributors"}]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
video = ["Pillow>=10.1"]

[project.scripts]
jev-vampire = "vampire_agent.__main__:main"

[project.urls]
Repository = "https://github.com/banjtheman/jev-vampire-survivors"
Issues = "https://github.com/banjtheman/jev-vampire-survivors/issues"

[tool.setuptools.packages.find]
include = ["vampire_agent*"]
